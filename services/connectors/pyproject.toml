[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[project]
name = "connectors"
version = "0.1.0"
description = "UTMIST shared internal source-connector API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-httplib2>=0.2",
    "pypdf>=6.15.0",
    "python-docx>=1.1",
    "platform-auth",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.sources]
platform-auth = { workspace = true }

[project.scripts]
connectors-keys = "src.mint_key:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
