<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>UTMIST bot playground</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="top-strip">
    <span class="spoof-badge">Spoof mode · ephemeral DB</span>
    <label>Acting as:
      <input id="actingAs" list="people-list" placeholder="Type or pick a Discord ID" autocomplete="off">
    </label>
    <datalist id="people-list"></datalist>
    <button id="reset-btn">Reset DB</button>
  </div>
  <div class="main">
    <aside class="sidebar">
      <h2>Commands</h2>
      <div id="command-list"></div>
    </aside>
    <section class="chat">
      <div class="transcript" id="transcript"></div>
      <form class="dm-form" id="dm-form">
        <label for="dm-content">DM Misty</label>
        <input id="dm-content" name="content" placeholder="Ask a private follow-up…" required>
        <button type="submit">Send DM</button>
      </form>
      <div class="form-strip" id="form-strip">
        <em>Select a command from the sidebar.</em>
      </div>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
