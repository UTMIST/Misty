name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team_tracking
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: team_tracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team_tracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://team_tracking:dev_password@localhost:5432/team_tracking
    defaults:
      run:
        working-directory: services/team-tracking
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest

  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/team-tracking
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  auth-lib-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/auth
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  verification-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: verification
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U verification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://verification:dev_password@localhost:5434/verification
    defaults:
      run:
        working-directory: services/verification
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  llm-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  # No Postgres service container and no AWS credentials: `meeting` has no
  # database, and its Transcribe/LLM clients are faked via
  # `app.dependency_overrides`, so the suite runs offline.
  meeting-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/meeting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  connectors-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/connectors
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  documentation-system-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: docs
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://docs:dev_password@localhost:5435/docs
      # Runs the Postgres-adapter suite (test_postgres_adapter.py), which is
      # otherwise skipped. See tests/test_postgres_adapter.py.
      RUN_PG_TESTS: "1"
    defaults:
      run:
        working-directory: services/documentation-system
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  node-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build team-tracking image
        run: docker build -f services/team-tracking/Dockerfile -t team-tracking:ci .
      - name: Smoke-test team-tracking image (imports incl. contracts/ resolve at boot)
        run: docker run --rm team-tracking:ci python -c "import src.api.app"
      - name: Build documentation-system image
        run: docker build -f services/documentation-system/Dockerfile -t documentation-system:ci .
      - name: Smoke-test documentation-system image (imports incl. contracts/ resolve at boot)
        run: docker run --rm documentation-system:ci python -c "import src.api.app"
      - name: Build llm image
        run: docker build -f services/llm/Dockerfile -t llm:ci .
      - name: Smoke-test llm image (imports resolve at boot)
        run: docker run --rm llm:ci python -c "import src.api.app"
      - name: Build discord-bot image
        run: docker build -t discord-bot:ci ./discord-bot
      - name: Smoke-test discord-bot image (source parses)
        run: docker run --rm discord-bot:ci node --check src/index.js
      - name: Build verification image
        run: docker build -f services/verification/Dockerfile -t verification:ci .
      - name: Smoke-test verification image (imports incl. contracts/ resolve at boot)
        run: docker run --rm verification:ci python -c "import src.api.app"
      - name: Build meeting image
        run: docker build -f services/meeting/Dockerfile -t meeting:ci .
      - name: Smoke-test meeting image (imports incl. PyAV/ffmpeg resolve at boot)
        run: docker run --rm meeting:ci python -c "import src.api.app"
      - name: Build connectors image
        run: docker build -f services/connectors/Dockerfile -t connectors:ci .
      - name: Smoke-test connectors image (imports resolve at boot)
        run: docker run --rm connectors:ci python -c "import src.api.app"
