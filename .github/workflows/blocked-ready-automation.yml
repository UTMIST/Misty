name: blocked-ready-automation

# Keeps issue blocker state in sync automatically.
#
# Declare blockers in an issue body with a line like:
#   Blocked by: #40, #42
# (case-insensitive, anywhere in the body; the colon is optional, so
# "Blocked by #40" also works). The `blocked` label marks issues
# that still have an open blocker; `ready` marks issues whose blockers are all
# resolved.
#
# - When an issue is OPENED or EDITED: it evaluates its OWN `Blocked by:` line and
#   sets its own state — `blocked` if any blocker is still open, `ready` if all are
#   closed (or there is no `Blocked by:` line to act on). This is what makes a
#   freshly-created blocked issue land its state without manual labelling.
# - When a blocker issue is CLOSED: every issue it blocks whose blockers are now
#   ALL closed gets `blocked` removed + `ready` added.
# - When a blocker issue is REOPENED: the issues it blocks get re-blocked
#   (`ready` removed + `blocked` added).
#
# Assignment tracking (keeps the "ready" queue and the board honest):
# - When an issue is ASSIGNED: it's being worked, so it's no longer up for grabs
#   — the `ready` label is removed. Board Status is left untouched (a human moves
#   the card to In progress / In review).
# - When an issue is UNASSIGNED and no assignees remain: if it is not blocked, it
#   goes back on the queue — `ready` label restored and board Status set to Ready.
#
# Board Status (optional): if a Projects-scoped PAT is stored as the
# PROJECTS_TOKEN repo secret, the dependent issue's project Status is also set to
# Ready / Blocked. Without that secret only labels change — the board step
# no-ops and the run still succeeds (same "unset secret = skip" pattern as
# discord-pr-notify.yml).
#
# See issue #33 (LLM service epic) — the first set of blocker/blocked issues.

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned]

permissions:
  issues: write

jobs:
  sync-blockers:
    runs-on: ubuntu-latest
    steps:
      - name: Sync dependent issues
        uses: actions/github-script@v7
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          script: |
            // --- Project board config (stable IDs for org project #13, "Misty") ---
            const PROJECT_ID   = 'PVT_kwDOAovuf84BgUkT';
            const STATUS_FIELD = 'PVTSSF_lADOAovuf84BgUkTzhahLEM';
            const OPT_READY    = '08afe404';
            const OPT_BLOCKED  = 'dc1ac841';

            const { owner, repo } = context.repo;
            const changed = context.payload.issue.number;
            const action  = context.payload.action; // opened|edited|closed|reopened|assigned|unassigned
            const token   = process.env.PROJECTS_TOKEN;

            // Parse a "Blocked by: #1, #2" line into blocker numbers.
            const blockersOf = (body) => {
              const line = (body || '').match(/^.*blocked by:?\s.*$/im);
              if (!line) return [];
              return [...line[0].matchAll(/#(\d+)/g)].map((m) => Number(m[1]));
            };

            // Cache issue state lookups (blockers may be closed, so not in the open list).
            const stateCache = new Map();
            const stateOf = async (n) => {
              if (!stateCache.has(n)) {
                // Isolate per-blocker failures: a deleted/inaccessible blocker must
                // not abort the whole run. 'unknown' !== 'closed', so it counts as
                // outstanding below and never falsely marks a dependent ready.
                try {
                  const { data } = await github.rest.issues.get({ owner, repo, issue_number: n });
                  stateCache.set(n, data.state);
                } catch (e) {
                  core.warning(`#${n}: could not fetch blocker state: ${e.message}`);
                  stateCache.set(n, 'unknown');
                }
              }
              return stateCache.get(n);
            };

            // Optional: set the issue's project Status via the PAT (skipped if unset).
            const gqlPAT = async (query, variables) => {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 10000);
              let res;
              try {
                res = await fetch('https://api.github.com/graphql', {
                  method: 'POST',
                  headers: { Authorization: `bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query, variables }),
                  signal: controller.signal,
                });
              } finally {
                clearTimeout(timer);
              }
              if (!res.ok) throw new Error(`GraphQL HTTP ${res.status}`);
              const json = await res.json();
              if (json.errors) throw new Error(JSON.stringify(json.errors));
              return json.data;
            };
            const setBoardStatus = async (issueNumber, optionId) => {
              if (!token) return;
              try {
                const data = await gqlPAT(
                  `query($owner:String!,$repo:String!,$number:Int!){
                     repository(owner:$owner,name:$repo){ issue(number:$number){
                       projectItems(first:20){ nodes{ id project{ id } } } } } }`,
                  { owner, repo, number: issueNumber },
                );
                const item = data.repository.issue.projectItems.nodes
                  .find((n) => n.project.id === PROJECT_ID);
                if (!item) { core.info(`#${issueNumber}: not on the project board — skipping Status.`); return; }
                await gqlPAT(
                  `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                     updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,
                       value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }`,
                  { p: PROJECT_ID, i: item.id, f: STATUS_FIELD, o: optionId },
                );
                core.info(`#${issueNumber}: board Status updated.`);
              } catch (e) {
                core.warning(`#${issueNumber}: board Status update failed: ${e.message}`);
              }
            };

            // add and/or remove a label; pass null to skip either side (assign only
            // removes `ready`, so it calls setLabels(n, null, 'ready')).
            const setLabels = async (issueNumber, add, remove) => {
              if (add) {
                try { await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [add] }); }
                catch (e) { core.warning(`#${issueNumber}: add '${add}' failed: ${e.message}`); }
              }
              if (remove) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: remove }); }
                catch (e) { if (e.status !== 404) core.warning(`#${issueNumber}: remove '${remove}' failed: ${e.message}`); }
              }
            };

            if (!token) core.info('PROJECTS_TOKEN not set — updating labels only (board Status skipped).');

            // opened / edited: the changed issue evaluates its OWN blockers and sets
            // its own state. This is what lands the initial 'blocked'/'ready' state on
            // a newly-created (or newly-edited) issue — the close/reopen paths below
            // only ever act on an issue's *dependents*, never on the issue itself.
            if (action === 'opened' || action === 'edited') {
              // Only sync availability while the issue is open and unassigned. An
              // edit can land on a closed issue (would mark a done issue ready) or
              // an assigned/in-progress one (would undo the assignment strip and put
              // it back on the queue) — mirror the assigned/unassigned guards.
              if (context.payload.issue.state === 'closed') {
                core.info(`#${changed}: closed — blocker sync skipped.`);
                return;
              }
              const assignees = context.payload.issue.assignees || [];
              if (assignees.length > 0) {
                core.info(`#${changed}: assigned — blocker sync skipped.`);
                return;
              }
              const selfBlockers = blockersOf(context.payload.issue.body);
              if (selfBlockers.length === 0) {
                core.info(`#${changed}: no "Blocked by:" line — nothing to do.`);
                return;
              }
              const states = await Promise.all(selfBlockers.map(stateOf));
              const outstanding = selfBlockers.filter((_, idx) => states[idx] !== 'closed');
              if (outstanding.length === 0) {
                await setLabels(changed, 'ready', 'blocked');
                await setBoardStatus(changed, OPT_READY);
                core.info(`#${changed}: all blockers resolved → ready.`);
              } else {
                await setLabels(changed, 'blocked', 'ready');
                await setBoardStatus(changed, OPT_BLOCKED);
                core.info(`#${changed}: blocked by ${outstanding.map((n) => '#' + n).join(', ')}.`);
              }
              return;
            }

            // assigned / unassigned: sync the changed issue's OWN availability.
            // Assigning claims it (drop `ready`); fully unassigning frees it again
            // (restore `ready` + board Ready) unless it's still blocked.
            if (action === 'assigned' || action === 'unassigned') {
              if (context.payload.issue.state === 'closed') {
                core.info(`#${changed}: closed — assignment sync skipped.`);
                return;
              }
              if (action === 'assigned') {
                // Being worked → no longer up for grabs. Strip `ready` only; leave
                // the board Status to a human (In progress / In review).
                await setLabels(changed, null, 'ready');
                core.info(`#${changed}: assigned → 'ready' label removed.`);
                return;
              }
              // unassigned: only re-open the queue once nobody is left assigned.
              const assignees = context.payload.issue.assignees || [];
              if (assignees.length > 0) {
                core.info(`#${changed}: still has ${assignees.length} assignee(s) — no change.`);
                return;
              }
              const selfBlockers = blockersOf(context.payload.issue.body);
              const states = await Promise.all(selfBlockers.map(stateOf));
              const outstanding = selfBlockers.filter((_, idx) => states[idx] !== 'closed');
              if (outstanding.length === 0) {
                await setLabels(changed, 'ready', 'blocked');
                await setBoardStatus(changed, OPT_READY);
                core.info(`#${changed}: fully unassigned & unblocked → ready.`);
              } else {
                core.info(`#${changed}: unassigned but still blocked by ${outstanding.map((n) => '#' + n).join(', ')} — 'ready' not restored.`);
              }
              return;
            }

            // Find open issues that declare the changed issue as a blocker.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const dependents = open.filter((i) => !i.pull_request && blockersOf(i.body).includes(changed));
            if (dependents.length === 0) {
              core.info(`No open issues are blocked by #${changed}.`);
              return;
            }

            for (const dep of dependents) {
              if (action === 'reopened') {
                // A blocker reopened → this issue is blocked again.
                await setLabels(dep.number, 'blocked', 'ready');
                await setBoardStatus(dep.number, OPT_BLOCKED);
                core.info(`#${dep.number}: re-blocked (blocker #${changed} reopened).`);
                continue;
              }
              // action === 'closed': ready only if ALL blockers are closed.
              const blockers = blockersOf(dep.body);
              const states = await Promise.all(blockers.map(stateOf));
              const outstanding = blockers.filter((_, idx) => states[idx] !== 'closed');
              if (outstanding.length === 0) {
                await setLabels(dep.number, 'ready', 'blocked');
                await setBoardStatus(dep.number, OPT_READY);
                core.info(`#${dep.number}: all blockers resolved → ready.`);
              } else {
                core.info(`#${dep.number}: still blocked by ${outstanding.map((n) => '#' + n).join(', ')}.`);
              }
            }
