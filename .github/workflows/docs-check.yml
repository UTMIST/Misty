name: Documentation

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  merge_group:
    types: [checks_requested]
    branches: [staging]

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check documentation and checker regressions
        run: make check-docs
