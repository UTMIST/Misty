name: Monitor service readiness

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: readiness-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ${{ vars.READINESS_CHECKER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore checker state
        uses: actions/cache/restore@v4
        with:
          path: .readiness-state.json
          key: readiness-state-${{ github.run_id }}
          restore-keys: readiness-state-
      - name: Poll readiness and notify Discord
        env:
          READINESS_ENDPOINTS: ${{ vars.READINESS_ENDPOINTS }}
          READINESS_FAILURE_THRESHOLD: ${{ vars.READINESS_FAILURE_THRESHOLD || '2' }}
          READINESS_POLL_INTERVAL_SECONDS: ${{ vars.READINESS_POLL_INTERVAL_SECONDS || '300' }}
          READINESS_STATE_FILE: .readiness-state.json
          DISCORD_READINESS_WEBHOOK: ${{ secrets.DISCORD_READINESS_WEBHOOK }}
        run: node scripts/readiness-checker.js
      - name: Save checker state
        uses: actions/cache/save@v4
        with:
          path: .readiness-state.json
          key: readiness-state-${{ github.run_id }}
