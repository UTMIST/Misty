<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1240" viewBox="0 0 640 620" role="img" aria-labelledby="title description">
  <title id="title">Example of a private Misty profile reply</title>
  <desc id="description">Illustration with fictional data. After whoami, Misty shows Alex Chen, email alex@example.com, access level member, status Active, and Discord identity Alex. Only Alex can see this reply.</desc>
  <rect width="640" height="620" rx="20" fill="#f1f4fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="40" fill="#002fcb" font-size="13" font-weight="700" letter-spacing="1.4">MISTY USER GUIDE</text>
    <text x="28" y="78" fill="#19233f" font-size="28" font-weight="700">Check your linked profile</text>
    <text x="28" y="105" fill="#57627a" font-size="15">Illustration · fictional account · simplified Discord layout</text>
    <rect x="24" y="126" width="592" height="458" rx="14" fill="#313338"/>
    <rect x="44" y="146" width="552" height="40" rx="7" fill="#232428"/>
    <text x="60" y="172" fill="#dce2ff" font-size="18" font-family="Menlo, Consolas, monospace">/whoami</text>
    <circle cx="65" cy="226" r="21" fill="#4567ee"/>
    <text x="65" y="234" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">M</text>
    <text x="101" y="223" fill="#fff" font-size="21" font-weight="700">Misty</text>
    <rect x="168" y="206" width="42" height="22" rx="5" fill="#5865f2"/>
    <text x="189" y="221" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">APP</text>
    <text x="101" y="247" fill="#b8becb" font-size="14">Only you can see this reply</text>
    <rect x="100" y="264" width="496" height="294" rx="7" fill="#2b2d31"/>
    <rect x="100" y="264" width="4" height="294" rx="2" fill="#8798ff"/>
    <text x="122" y="300" fill="#fff" font-size="23" font-weight="700">Alex Chen</text>
    <text x="122" y="336" fill="#fff" font-size="16" font-weight="700">Email</text>
    <text x="122" y="360" fill="#d8dce4" font-size="19">alex@example.com</text>
    <text x="122" y="394" fill="#fff" font-size="16" font-weight="700">Access level</text>
    <text x="122" y="418" fill="#d8dce4" font-size="19">member</text>
    <text x="122" y="452" fill="#fff" font-size="16" font-weight="700">Status</text>
    <text x="122" y="476" fill="#d8dce4" font-size="19">Active</text>
    <text x="122" y="510" fill="#fff" font-size="16" font-weight="700">Identities</text>
    <text x="122" y="537" fill="#d8dce4" font-size="19">discord:</text>
    <rect x="196" y="517" width="71" height="27" rx="4" fill="#424b79"/>
    <text x="204" y="537" fill="#dce2ff" font-size="18">@Alex</text>
    <text x="28" y="605" fill="#57627a" font-size="14">Your real name, email, and linked identities will appear here.</text>
  </g>
</svg>
