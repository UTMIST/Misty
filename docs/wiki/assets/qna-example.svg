<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1340" viewBox="0 0 640 670" role="img" aria-labelledby="title description">
  <title id="title">Example of a private live meeting Q&amp;A answer</title>
  <desc id="description">Fictional example, in progress. Misty identifies Robotics weekly_2026-10-23_1500.pdf, answers that the wiring diagram is due Friday and Alex will post it, cites Alex at 08:42 and Sam at 10:05, and reports transcript used 03:00 to 18:00. The reply is private to the requester.</desc>
  <rect width="640" height="670" rx="20" fill="#f1f4fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="40" fill="#002fcb" font-size="13" font-weight="700" letter-spacing="1.4">MISTY USER GUIDE</text>
    <rect x="462" y="23" width="150" height="26" rx="13" fill="#fff0c2"/>
    <text x="537" y="41" text-anchor="middle" fill="#6b4800" font-size="12" font-weight="700">Q&amp;A · IN PROGRESS</text>
    <text x="28" y="78" fill="#19233f" font-size="28" font-weight="700">Read the answer and its sources</text>
    <text x="28" y="105" fill="#57627a" font-size="15">Illustration · fictional meeting · simplified Discord layout</text>
    <rect x="24" y="126" width="592" height="464" rx="14" fill="#313338"/>
    <circle cx="65" cy="168" r="21" fill="#4567ee"/>
    <text x="65" y="176" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">M</text>
    <text x="101" y="165" fill="#fff" font-size="21" font-weight="700">Misty</text>
    <rect x="168" y="148" width="42" height="22" rx="5" fill="#5865f2"/>
    <text x="189" y="163" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">APP</text>
    <text x="101" y="189" fill="#b8becb" font-size="14">Only you can see this reply</text>
    <text x="101" y="233" fill="#fff" font-size="20" font-weight="700">Meeting:</text>
    <text x="101" y="262" fill="#fff" font-size="19" font-weight="700">Robotics weekly_2026-10-23_1500.pdf</text>
    <text x="101" y="313" fill="#f2f3f5" font-size="20">We agreed to finish the wiring diagram</text>
    <text x="101" y="343" fill="#f2f3f5" font-size="20">before Friday. Alex will post the</text>
    <text x="101" y="373" fill="#f2f3f5" font-size="20">updated diagram.</text>
    <text x="101" y="432" fill="#fff" font-size="19" font-weight="700">Sources:</text>
    <text x="101" y="462" fill="#d8dce4" font-size="20">Alex — 08:42; Sam — 10:05</text>
    <text x="101" y="518" fill="#fff" font-size="19" font-weight="700">Transcript used:</text>
    <text x="101" y="548" fill="#d8dce4" font-size="20">03:00–18:00</text>
    <text x="28" y="622" fill="#19233f" font-size="16" font-weight="700">Check the meeting, speaker references, and time window.</text>
    <text x="28" y="649" fill="#57627a" font-size="14">A new question is answered independently of previous questions.</text>
  </g>
</svg>
